# Native linux/amd64 build of the Quackback ("hub") image on Cloud Build.
# Used instead of local buildx/QEMU emulation, which produces a bun bundle whose
# threaded SSR render path deadlocks at runtime (API routes work, every server-
# rendered page hangs). Cloud Build runs on amd64 natively, so no emulation.
#
# Submit from a clean checkout so the tag names exactly what was built:
#   gcloud builds submit --project superb-blend-305320 \
#     --substitutions=_TAG=$(git rev-parse --short=9 HEAD),_REVISION=$(git rev-parse HEAD)
# _TAG is required (an empty tag fails the build). The image is also tagged
# :latest. Deploy by setting quackback_image_tag to _TAG; never re-push a tag.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-f'
      - 'apps/web/Dockerfile'
      - '--label'
      - 'org.opencontainers.image.revision=${_REVISION}'
      - '--label'
      - 'org.opencontainers.image.source=https://github.com/ExcellenceCloudGmbH/quackback'
      - '-t'
      - '${_IMAGE}:${_TAG}'
      - '-t'
      - '${_IMAGE}:latest'
      - '.'
images:
  - '${_IMAGE}:${_TAG}'
  - '${_IMAGE}:latest'
substitutions:
  _IMAGE: 'europe-docker.pkg.dev/superb-blend-305320/lex-prod-registry/hub'
  _TAG: ''
  _REVISION: ''
options:
  machineType: 'E2_HIGHCPU_8'
  dynamicSubstitutions: true
timeout: '2400s'
